plugins {
    id 'io.kestra.gradle.repository-conventions' version '1.2.10'
    id "io.kestra.gradle.plugin-doc-lint" version "1.2.10"
    id "com.vanniktech.maven.publish" version "0.37.0"
    id "io.kestra.gradle.inject-bom-versions" version "1.2.10"
    id 'java-library'
    id "idea"
    id 'jacoco'
    id "com.gradleup.shadow" version "9.6.1"
    id 'signing'
    id 'net.researchgate.release' version '3.1.0'
}

def isBuildSnapshot = version.toString().endsWith("-SNAPSHOT")

repositories {
    mavenLocal()
    mavenCentral()
    if (isBuildSnapshot) {
        maven { url "https://central.sonatype.com/repository/maven-snapshots/" }
    }
}

final targetJavaVersion = JavaVersion.VERSION_21

java {
    sourceCompatibility = targetJavaVersion
    targetCompatibility = targetJavaVersion
}

group = "io.kestra.plugin"
description = 'Apache Iceberg plugin for Kestra'

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs.add("-parameters")
}

dependencies {
    // Platform
    annotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    implementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    annotationProcessor "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok"

    // kestra
    annotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    compileOnly group: "io.kestra", name: "core", version: kestraVersion
    compileOnly group: "io.kestra", name: "script", version: kestraVersion

    // Apache Iceberg platform & modules
    implementation platform("org.apache.iceberg:iceberg-bom:1.11.0")
    implementation "org.apache.iceberg:iceberg-api"
    implementation "org.apache.iceberg:iceberg-core"
    implementation "org.apache.iceberg:iceberg-data"
    implementation "org.apache.iceberg:iceberg-parquet"
    implementation "org.apache.iceberg:iceberg-aws"
    implementation "org.apache.iceberg:iceberg-aws-bundle"

    // Minimal Hadoop support with aggressive exclusions for Parquet/Hive compatibility
    implementation("org.apache.hadoop:hadoop-common:3.4.1") {
        exclude group: "org.apache.hadoop", module: "hadoop-hdfs"
        exclude group: "org.apache.hadoop", module: "hadoop-hdfs-client"
        exclude group: "org.apache.hadoop", module: "hadoop-yarn-api"
        exclude group: "org.apache.hadoop", module: "hadoop-yarn-common"
        exclude group: "org.apache.hadoop", module: "hadoop-yarn-client"
        exclude group: "org.apache.hadoop", module: "hadoop-mapreduce-client-core"
        exclude group: "org.apache.hadoop", module: "hadoop-auth"
        exclude group: "org.slf4j", module: "slf4j-reload4j"
        exclude group: "org.slf4j", module: "slf4j-log4j12"
        exclude group: "log4j", module: "log4j"
        exclude group: "ch.qos.reload4j", module: "reload4j"
        exclude group: "org.eclipse.jetty"
        exclude group: "com.sun.jersey"
        exclude group: "org.apache.kerby"
        exclude group: "org.apache.curator"
        exclude group: "org.apache.zookeeper"
        exclude group: "org.apache.avro", module: "avro"
    }
}



/**********************************************************************************************************************\
 * Test
 **********************************************************************************************************************/
test {
    useJUnitPlatform()
    systemProperties System.properties
    systemProperty "iceberg.rest.integration", System.getProperty("iceberg.rest.integration", System.getenv("ICEBERG_REST_INTEGRATION") ?: "false")
}

dependencies {
    // Platform
    testAnnotationProcessor enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")

    // lombok
    testAnnotationProcessor "org.projectlombok:lombok"
    testCompileOnly 'org.projectlombok:lombok'

    // micronaut
    testAnnotationProcessor "io.micronaut:micronaut-inject-java"
    testAnnotationProcessor "io.micronaut.validation:micronaut-validation-processor"
    testImplementation "io.micronaut.test:micronaut-test-junit5"
    testImplementation "io.micronaut:micronaut-jackson-databind"

    // test deps needed only for to have a runner
    testAnnotationProcessor group: "io.kestra", name: "processor", version: kestraVersion
    testImplementation group: "io.kestra", name: "core", version: kestraVersion
    testImplementation group: "io.kestra", name: "tests", version: kestraVersion
    testImplementation group: "io.kestra", name: "script", version: kestraVersion
    testImplementation group: "io.kestra", name: "repository-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "runner-memory", version: kestraVersion
    testImplementation group: "io.kestra", name: "storage-local", version: kestraVersion

    // test
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.hamcrest:hamcrest-library"
    // Testcontainers versions are managed by the Kestra platform BOM above
}

/**********************************************************************************************************************\
 * Allure Reports
 **********************************************************************************************************************/
dependencies {
    testImplementation enforcedPlatform("io.kestra:platform:$kestraVersion")
    testImplementation "io.qameta.allure:allure-junit5"
}

/**********************************************************************************************************************\
 * Jacoco
 **********************************************************************************************************************/
test {
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required.set(true)
    }
}

/**********************************************************************************************************************\
 * Publish
 **********************************************************************************************************************/
mavenPublishing {
    publishToMavenCentral(true)
    signAllPublications()
    coordinates("${project.group}", "${project.name}", "${project.version}")
    pom {
        name = "${project.name}"
        description = "${project.group}:${project.name}:${project.version}"
        url = "https://github.com/kestra-io/${project.name}"
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'tchiotludo'
                name = 'Dehon'
                email = 'ldehon@kestra.io'
            }
        }
        scm {
            connection = 'scm:git:'
            url = "https://github.com/kestra-io/${project.name}"
        }
    }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    // Suppression this validation error as we want to enforce the Kestra platform
    suppressedValidationErrors.add('enforced-platform')
}

jar {
    manifest {
        attributes(
            "X-Kestra-Name": project.name,
            "X-Kestra-Title": "Apache Iceberg",
            "X-Kestra-Group": project.group + ".iceberg",
            "X-Kestra-Description": project.description,
            "X-Kestra-Version": project.version
        )
    }
}

shadowJar {
    archiveClassifier.set(null)
    mergeServiceFiles()
    zip64 = true
}

/**********************************************************************************************************************\
 * Version
 **********************************************************************************************************************/
release {
    preCommitText = 'chore(version):'
    preTagCommitMessage = 'update to version'
    tagCommitMessage = 'tag version'
    newVersionCommitMessage = 'update snapshot version'
    tagTemplate = 'v${version}'
    buildTasks = ['classes']
    git {
        requireBranch.set('main')
    }
}

/**********************************************************************************************************************\
 * Dev
 **********************************************************************************************************************/
idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

/**********************************************************************************************************************\
 * Verification Gate: No Spark or Flink Runtime Dependencies
 **********************************************************************************************************************/
tasks.register("checkNoSparkOrFlink") {
    description = "Asserts that no Spark or Flink dependencies are present in runtimeClasspath"
    group = "verification"
    doLast {
        def forbidden = ["spark", "flink"]
        def found = []
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def id = artifact.moduleVersion.id
            forbidden.each { word ->
                if (id.group.toLowerCase().contains(word) || id.name.toLowerCase().contains(word)) {
                    found.add("${id.group}:${id.name}:${id.version}")
                }
            }
        }
        if (!found.isEmpty()) {
            throw new GradleException("Forbidden compute engine runtime dependencies found in runtimeClasspath: " + found)
        }
        logger.lifecycle("✓ runtimeClasspath verified: 0 Spark or Flink dependencies found.")
    }
}

check.dependsOn("checkNoSparkOrFlink")

