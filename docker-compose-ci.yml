services:
  rest:
    # No 1.11.0 fixture image is published yet; 1.10.1 is the latest release tag (REST protocol is compatible with iceberg-bom 1.11.0).
    image: apache/iceberg-rest-fixture:1.10.1
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://rustfs:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
    depends_on:
      rustfs:
        condition: service_healthy

  rustfs:
    # MinIO's open-source edition is archived and no longer publishes images, so the S3 backend is RustFS,
    # an Apache-2.0 S3-compatible server (same image as kestra-io/plugin-huawei), pinned by digest.
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
    # Pre-create the warehouse bucket as a directory under /data (RustFS lists top-level folders as buckets),
    # which removes the need for a separate S3 client container.
    entrypoint:
      - sh
      - -c
      - "mkdir -p /data/warehouse && exec /entrypoint.sh rustfs"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
